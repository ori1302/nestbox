; NestBox on the Waveshare ESP32-S3-LCD-1.69 (no touch), or the ESP32-S3-LCD-2 with -e nestbox-2in.
; Build, flash and Wi-Fi steps: https://nestbox.pet/docs/firmware/
;   pio run                      build the firmware and the NESTBOX drive image
;   pio run -t upload            flash both
;   pio run -t uploadfs          flash the eggs (the data image, filled from ../../pets and ../../pets/retro)
;   pio device monitor           the USB console (type `help`)

[platformio]
default_envs = nestbox

[env:nestbox]
platform = platformio/espressif32 @ 8.0.0
board = waveshare_esp32_s3_lcd_169
framework = arduino
; ESP32-S3R8: quad flash, octal PSRAM. The eggs and the canvases live in PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; The eggs that go into the data image: <name>.egg from NESTBOX_EGGS (a folder outside the repo) if set, else from
; ../../pets and ../../pets/retro. NESTBOX_PETS overrides this list.
custom_pets = nibble goose milo robot slime penguin
; USB through TinyUSB on the USB-OTG controller (not the built-in USB-Serial/JTAG): a composite device with
; the console (CDC) and the NESTBOX drive (MSC), and it can see the computer suspend the bus when it sleeps.
board_build.extra_flags =
    -DARDUINO_WAVESHARE_ESP32_S3_LCD_169
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DARDUINO_USB_MODE=0
; Uploads: esptool's reset (or a 1200-baud touch) makes the running firmware restart into the ROM loader, which
; comes back as a new USB port. If that fails, hold BOOT while plugging in.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; -O2, not the framework's -Os: about six times faster frames (measured on the LCD-2, 43 to 7 ms), and smaller.
; At -Os the small helpers aren't inlined, and each call on the Xtensa's register windows can trap to spill them.
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
extra_scripts =
    pre:scripts/version.py
    pre:scripts/pets.py
    pre:scripts/engine.py
    scripts/drive.py
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter

; The first board revision (no "V2" QC sticker): buzzer and power pins moved in V2. See src/board.h.
[env:nestbox-v1]
extends = env:nestbox
build_flags = ${env:nestbox.build_flags} -DNESTBOX_BOARD_V1

; The 2-inch board, Waveshare ESP32-S3-LCD-2 (no touch): the same ESP32-S3R8 and 16 MB flash, so the same board
; definition and partitions; its pins and panel are in src/board.h.
[env:nestbox-2in]
extends = env:nestbox
build_flags = ${env:nestbox.build_flags} -DNESTBOX_BOARD_LCD2
