name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Engine, packer and quick tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow (the studio tools)
        run: python -m pip install pillow
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNESTBOX_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build -L quick --output-on-failure

  macos:
    name: Everything (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: brew install sdl2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow (the studio tools)
        run: python -m pip install pillow
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNESTBOX_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Build the menu bar app
        run: scripts/build_app.sh
      - name: Quick tests
        run: ctest --test-dir build -L quick --output-on-failure
      # The network tests run real simulators and find them over Bonjour (mDNS) on the runner.
      - name: Network tests
        run: ctest --test-dir build -L network --output-on-failure

  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/esp32/platformio.ini') }}
      - name: Install PlatformIO
        run: pipx install platformio
      - name: Build
        run: pio run -d firmware/esp32
